<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Результаты анализа</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Результаты анализа</h1>
    <p>Файл: <b th:text="${fileName}"></b></p>
    <table>
        <thead>
        <tr>
            <th>Метод анализа</th>
            <th>Распознанный язык</th>
            <th>Время выполнения (мс)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="res : ${results}">
            <td th:text="${res.methodName}"></td>
            <td th:text="${res.detectedLanguage}"></td>
            <td th:text="${res.durationMs}"></td>
        </tr>
        </tbody>
    </table>
    <br/>
    <a href="/">Анализировать другой файл</a>
</div>
</body>
</html>
