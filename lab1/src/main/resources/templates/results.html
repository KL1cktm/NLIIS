<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Результаты поиска</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
  <header>
    <h1><a href="/">Локальная поисковая система</a></h1>
  </header>
  <main>
    <form th:action="@{/search}" method="post" class="search-form">
      <input type="text" name="query" th:value="${query}" required>
      <button type="submit">Найти</button>
    </form>

    <div th:if="${error}" class="error-message">
      <p th:text="${error}"></p>
    </div>

    <div th:if="${results != null and not results.isEmpty()}">
      <h3>Результаты по запросу: "<span th:text="${query}"></span>"</h3>
      <ol class="results-list">
        <li th:each="result : ${results}">
          <div class="result-item">
            <h4 class="result-title" th:text="${result.title}">Заголовок документа</h4>
            <p class="snippet" th:text="${result.snippet}">Фрагмент текста...</p>
            <div class="meta">
              <span>Ранг (TF-IDF Score): <b th:text="${#numbers.formatDecimal(result.rank, 1, 4)}">0.0</b></span>
              <div th:if="${result.presentTerms != null and not result.presentTerms.isEmpty()}" class="terms">
                Слова запроса в документе: <span th:each="term, iter : ${result.presentTerms}" th:text="${term + (iter.last ? '' : ', ')}"></span>
              </div>
            </div>
          </div>
        </li>
      </ol>
    </div>

    <div th:if="${results != null and results.isEmpty()}">
      <p class="muted">По вашему запросу ничего не найдено.</p>
    </div>
  </main>
</div>
</body>
</html>
